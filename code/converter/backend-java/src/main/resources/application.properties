# ── Server ──────────────────────────────────────────────────────────────────
server.port=3001

# ── File upload limits (500 MB per file, 10 GB per request for batch uploads)
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=10000MB

# ── App paths ────────────────────────────────────────────────────────────────
# Override these to use absolute paths if needed (e.g. on Linux: /tmp/tc-uploads)
app.upload-dir=./uploads
app.output-dir=./outputs

# ── Socket.IO port (separate from REST API port) ─────────────────────────────
app.socket-port=3002

# ── FFmpeg path ───────────────────────────────────────────────────────────────
# Default: expects ffmpeg on system PATH.
# If using the ffmpeg-static binary from the Node.js backend, set:
#   app.ffmpeg-path=../backend/node_modules/ffmpeg-static/ffmpeg.exe
app.ffmpeg-path=ffmpeg

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.threadconv=INFO
logging.level.com.corundumstudio.socketio=WARN
