# ── Server ───────────────────────────────────────────────────────────────────
server.port=3003

# ── Worker config ─────────────────────────────────────────────────────────────
# Base URL of the API service — worker posts progress/done/failed callbacks here
app.api-base-url=http://localhost:3001

# FFmpeg path — should match what the API uses
app.ffmpeg-path=ffmpeg

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.threadconv=INFO
